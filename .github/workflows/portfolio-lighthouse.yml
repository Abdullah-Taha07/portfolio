name: Portfolio Lighthouse metrics (report)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  lighthouse-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/ > /dev/null
      - name: Measure performance accessibility best practices and SEO
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-lighthouse
          path: .lighthouseci/
          if-no-files-found: warn
