name: Portfolio quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check js/portfolio-fsd.js
          node --check js/mishwar-case-study.js
          node --check demo/tour.js
      - name: Run offline source contract tests
        run: node --test tests/*.test.mjs
  browser-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and axe tooling
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock --no-audit --ignore-scripts axe-core@4.10.3
      - name: Test real Chromium interactions and axe WCAG violations
        run: python tests/browser_quality.py --axe-required
      - name: Upload browser and axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-accessibility
          path: quality-browser-report.json
          if-no-files-found: warn
